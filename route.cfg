}



route[NATMANAGE]{
    force_rport();
    if (nat_uac_test("private-contact,diff-ip-src-via,diff-port-src-via,private-via")) {
        xlog("L_INFO", "pt=[$time(%FT%T)] [NATMANAGE] NAT detected for $fu\n");
        fix_nated_register();
	fix_nated_sdp("rewrite-media-ip,rewrite-origin-ip");
        setbflag("NAT");
        setbflag("SIPPING_ENABLE");
        setbflag("DEAD_CONTACT");
    }
}
route[TO_PSTN] {
    if (dp_translate(1, $rU, $var(out))) {
        xlog("L_INFO", "pt=[$time(%FT%T)] [TO_PSTN] Translated: [$rU] -> [$var(out)]\n");
        $rU = $var(out);
    } else {
        xlog("L_WARN", "pt=[$time(%FT%T)] [TO_PSTN] No dialplan match for [$rU], using as-is\n");
    }
        $ru = "sip:" + $rU + "@185.224.132.227:5080";
	ds_select_dst(2, 0);
        #uac_replace_to("", $ru);
        route(RELAY);
        exit;
}

route[TO_TELESTORE] {
    create_dialog();
    if (dp_translate(2, $rU, $var(out))) {
        xlog("L_INFO", "pt=[$time(%FT%T)] [TO_TELESTORE] Translated: [$rU] -> [$var(out)]\n");
        $rU = $var(out);
    } else {
        xlog("L_WARN", "pt=[$time(%FT%T)] [TO_TELESTORE] No dialplan match for [$rU]\n");
    }

    $ru = "sip:" + $rU + "@" + $shv(carrier_host);
    $var(from_name) = "\"" + $shv(carrier_from_name) + "\"";
    uac_replace_from($var(from_name), $shv(carrier_from_uri));
     $var(to_uri) = "sip:" + $rU + "@" + $shv(carrier_host);
    if (!uac_replace_to("", $var(to_uri))) {
        xlog("L_WARN", "pt=[$time(%FT%T)] [TO_TELESTORE] uac_replace_to failed for [$rU]\n");
    }
    route(SDPMANAGE);
    t_on_reply("GLOBAL");
    t_on_failure("AUTH_TELESTORE");
    if (!t_relay()) {
        send_reply(500, "Relay failed");
    }
    exit;
}

route[TO_CARRIERS] {
    create_dialog();
    if (dp_translate(2, $rU, $var(out))) {
    xlog("L_INFO", "pt=[$time(%FT%T)] [TO_TELESTORE] Translated: [$rU] -> [$var(out)]\n");
    $rU = $var(out);
