route[SEND_REGISTER]{
    mid_registrar_save("location");
    xlog("L_INFO", "MID_REG retcode=$retcode for $tU\n");
    switch ($retcode) {
        case 1:
            add_path_received();
            ds_select_dst(2, 0);
            t_relay();
            break;
        case 2:
            break;
        default:
            xlog("L_ERR", "mid_registrar_save FAILED for $tU: retcode=$retcode\n");
            send_reply(500, "Registrar error");
    }
    exit;
}

route[FROM_FREESWITCH] {
    if (is_method("INVITE") && ($si == "185.224.132.227") && !has_totag()) {
        if (!lookup("location")) {
            send_reply(404, "Not Found");
            exit;
        }
        t_relay();
        exit;
    }
}



route[SWITCH] {
    switch ($si) {
        case "91.204.68.11":
            route(INCOMING);
            break;
        case "185.224.132.227":
            if (is_present_hf("X-CALL-FROM") && $hdr(X-CALL-FROM) == "FreeSWITCH") {
                route(TO_TELESTORE);
            } else {
                route(FROM_FREESWITCH);
            }
            break;
        default:
            if (!lookup("location", "method-filtering")) {
                set_dlg_profile("TO_PSTN");
                remove_hf("Contact");
                route(FIX_CONTACT);
                route(CHECK_DIRECTION);
                if (!route(TO_TELESTORE)){
                    route(TO_PSTN);
                }
            }
            do_accounting("log", "cdr");


            route(RELAY);
            break;
    }
}


route[BASIC]{
    if (is_method("ACK") && has_totag()) {
        if (loose_route()) {
            route(RELAY);
        } else {
            xlog("L_WARN", "$ci|ACK-2xx|no dialog found, dropping\n");
        }
        exit;
    }
    if (has_totag()) {
        xlog("L_INFO", "$ci|IN-DIALOG|method=$rm cseq=$cs from-tag=$ft to-tag=$tt\n");
        if ( is_method("ACK|CANCEL") && t_check_trans() ){
            xlog("L_INFO", "$ci|IN-DIALOG|relaying $rm as existing transaction\n");
            t_relay();
            exit;
        }

        if ( !loose_route() ) {
            xlog("L_ERR", "$ci|IN-DIALOG|loose_route() FAILED for $rm - no Route header / dialog not found\n");
            send_reply(404,"Not here");
            exit;
        }
        xlog("L_INFO", "$ci|IN-DIALOG|loose_route() OK, next-hop=$du\n");
        if (is_method("BYE")) {
            rtpengine_delete();
            do_accounting("db");
        }
        if (is_method("INVITE") && !has_totag()) {
            xlog("L_INFO", "$ci|IN-DIALOG|re-INVITE detected, entering SDPMANAGE\n");
            xlog("L_INFO", "$ci|IN-DIALOG|SDPMANAGE returned, relaying re-INVITE to $du\n");
        }
        route(RELAY);
        xlog("L_INFO", "$ci|IN-DIALOG|t_relay() called for $rm\n");
        exit;
    }  

    xlog("L_INFO", "$ci|NEW-DIALOG|method=$rm from=$fu to=$tu\n");
    t_check_trans();
    if(!(is_method("REGISTER"))){
        if(is_myself("$fd") || $si == 185.224.132.227) {
        }else {}
    }
    if (!is_myself("rd")){
    }else{
        xlog("L_NOTICE", "RELAY_FORBIDDEN from=$si:$sp user=$fU@$fd to=$rU@$rd\n");
        send_reply(403,"Relay Forbidden");
        exit;
    }

    if (loose_route()) {
        xlog("L_ERR", "Attempt to route with preloaded Route's [$fu/$tu/$ru/$ci]");
        if (!is_method("ACK")) send_reply(403,"Preload Route denied");
        exit;
    }
    }

route[CHECK_GEO] {
    if (mmg_lookup("country.iso_code:continent.names.en", "$si", $avp(attrs))) {
        $var(country) = $(avp(attrs)[1]);
        xlog("L_INFO", "pt=[$time(%FT%T)] [CHECK_GEO] $si country=$var(country)\n");
        append_hf("X-COUNTRY-SI: $var(country)\r\n");
    } else {
        $var(country) = "";
        xlog("L_INFO", "pt=[$time(%FT%T)] [CHECK_GEO] $si not found in GeoIP database\n");
    }
}

route[ALLOW_LOCATION] {
    $var(re_pattern) = "(^|\\|)" + $var(country) + "(\\||$)";
    if ($shv(allowed_country) =~ $var(re_pattern)) {
    } else {
        xlog("L_WARN", "pt=[$time(%FT%T)] country=$(avp(attrs)[1]) $si not allowed\r\n");
        send_reply(503, "Location not allowed");
        exit;
    }
}