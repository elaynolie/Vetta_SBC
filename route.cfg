        update_stat_series("counter_rl_alert_trunk_gr_60", "$(avp(init_ds_set)[$var(i)])", 0);
        update_stat_series("counter_rl_alert_trunk_60", "$(avp(init_ds_set)[$var(i)])", 0);
        $var(i) = $var(i) + 1;
        }
    
    }


route{
    if ($socket_in(proto) == "WS" || $socket_in(proto) == "WSS") {
        setflag("SRC_WSS");
    } else if ($socket_in(proto) == "UDP") {
        setflag("SRC_UDP");
    }

    force_rport();
    route(PREVALIDATE);
    route(PING);
    route(ANTI_SCAN);
    route(CHECK_GEO);
    route(ALLOW_LOCATION);
    xlog("L_INFO", "$ci|start|recieved $oP request $rm $ou\n");

    remove_hf("Path");

    if (!mf_process_maxfwd_header(10)) {
        xlog("L_ERR", "$ci|Loop detected|received $oP request $rm $ou\n");
        send_reply(483,"Too Many Hops");
        exit;
    }

    route(BASIC);


if (is_method("REGISTER")) {
    if ($shv(mode) == "midregisrar_mode") {
        xlog("L_INFO", "You setting midregistrar mode. SUBSCRIBER ON FreeSWITCH NONE\n");
        route(NATMANAGE);
        route(SEND_REGISTER);
    } else if ($shv(mode) == "registrar_mode") {
        xlog("L_INFO", "You set native registrar mode. see subscriber in table opensips");
       route(NATMANAGE);
        route(AUTH);
        route(REGISTRAR);
    }
}

    
if (!is_method("REGISTER|MESSAGE")) {
        remove_hf("Route");
        record_route();        
}       


if (is_method("INVITE") && !has_totag()) {
    if (!rl_check("$si", $shv(ratelimit), "TAILDROP")) {
        send_reply(503, "Rate Limit Exceeded");
        exit;
    }

    do_accounting("db|log");
}

    if (is_method("REFER|MESSAGE")) {
		send_reply(405, "Method Not Allowed");
		exit;
	}

	if ($rU==NULL) {
		send_reply(484,"Address Incomplete");
		exit;
	}

	if (!lookup("location","method-filtering")) {      
        if($rU =~ "^1[0-9]{3}$") {
             ds_select_dst(2, 0);
             route(RELAY);
             return;
        }
        if (is_method("INVITE") && $rU == "31421512") { 
            ds_select_dst(2, 0);
            route(RELAY);
            return;
            }
         set_dlg_profile("TO_PSTN");
		remove_hf("Contact");
        route(SWITCH);
        route(INCOMING);
		route(FIX_CONTACT);
		route(CHECK_DIRECTION);
		#route(TO_TELESTORE);
        
        
		if (!route(TO_CARRIERS)) {
    		route(TO_PSTN);
		}
		}
	do_accounting("log","cdr");
	route(RELAY);
}

route[CHECK_DIRECTION] {
   if (dp_translate(99, $rU, $var(dp_result), $var(dp_attrs))) {
    xlog("L_NOTICE", "FAIL_DIRECTION from=$si:$sp user=$fU@$fd blocked=$var(dp_attrs)\n");
    send_reply(403, "Forbidden");
    exit;
}
    }


route[RELAY] {
	if (is_method("INVITE") &&!has_totag()) {
        route("SDPMANAGE");
        t_on_reply("GLOBAL");
		t_on_branch("MANAGE_BRANCH");
		t_on_failure("missed_call");
	}

	if(!t_relay()) {
		send_reply(500,"Internal Error");
        xlog("L_ERR", "RELAY_FAIL from=$si:$sp destination=$rU@$rd rc=$rc\n");
		exit;
			}
}


route[TOPOH] {
