route[PREVALIDATE]{
    $var(bl_check) = null;
    if (cache_fetch("local:d", "blacklist:$si", $var(bl_check))) drop ();
        if(!has_totag()) {
            if (!is_method("OPTIONS|INVITE|REGISTER|CANCEL|NOTIFY")){
                drop();
            if(is_method("INVITE")){
                if($shv(ping_noresponce) == 1) {
                    send_reply(503, "Service Unavailable");
                    exit;
                }
    
            }
            }
        }
}

