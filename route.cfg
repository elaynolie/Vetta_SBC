startup_route {
    reset_stat("calls:ingress:trunk");
    reset_stat("calls:ingres:enduser");
    reset_stat("calls:egress:trunk");
    reset_stat("calls:egress:enduser"); 

	    sql_query("select distinct setid from dispatcher", "$avp(init_ds_set)");
        $var(i) = 0;
